<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Tammam Musyaffa | Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color-dark: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --bg-color-light: linear-gradient(135deg, #f5f7fa, #e4e8ee);
            --card-bg-dark: rgba(255, 255, 255, 0.08);
            --card-bg-light: rgba(255, 255, 255, 0.9);
            --text-color-dark: #ffffff;
            --text-color-light: #2d3748;
            --accent-color: #4fd1c5;
            --shadow-dark: 0 15px 35px rgba(0, 0, 0, 0.3);
            --shadow-light: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color-dark);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color-dark);
            transition: all 0.5s cubic-bezier(0.65, 0.05, 0.36, 1);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(79, 209, 197, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: float 15s infinite alternate;
        }
        
        .card {
            background: var(--card-bg-dark);
            color: var(--text-color-dark);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-dark);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(79, 209, 197, 0.1),
                transparent 60%
            );
            transform: rotate(30deg);
            z-index: -1;
        }
        
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            object-fit: cover;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .card:hover img {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 209, 197, 0.4);
        }
        
        .card h2 {
            margin: 20px 0 10px;
            font-size: 24px;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }
        
        .card h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 3px;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color-dark);
            border-radius: 50%;
            font-size: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .social-icons a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .social-icons a:hover {
            transform: translateY(-5px) scale(1.1);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 5px 15px rgba(79, 209, 197, 0.4);
        }
        
        .social-icons a:hover::before {
            left: 100%;
        }
        
        .toggle-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color-dark);
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        
        .toggle-btn:hover {
            background: var(--accent-color);
            color: white;
            transform: rotate(180deg) scale(1.1);
            box-shadow: 0 5px 20px rgba(79, 209, 197, 0.4);
        }
        
        .light-mode {
            background: var(--bg-color-light);
            color: var(--text-color-light);
        }
        
        .light-mode .card {
            background: var(--card-bg-light);
            color: var(--text-color-light);
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .light-mode .card::after {
            background: linear-gradient(
                to bottom right,
                rgba(79, 209, 197, 0.05),
                transparent 60%
            );
        }
        
        .light-mode .social-icons a {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-color-light);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .light-mode .social-icons a:hover {
            background: var(--accent-color);
            color: white;
        }
        
        .light-mode .toggle-btn {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-color-light);
        }
        
        .light-mode .toggle-btn:hover {
            background: var(--accent-color);
            color: white;
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-10%, -10%);
            }
            100% {
                transform: translate(10%, 10%);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 25px;
                max-width: 90%;
            }
            
            .card img {
                width: 110px;
                height: 110px;
            }
            
            .social-icons a {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            .toggle-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleMode()" aria-label="Toggle dark/light mode">
        <i class="fas fa-adjust"></i>
    </button>
    
    <div class="card">
        <img src="https://student.budiluhur.ac.id/foto/2023/2311501841.jpg" alt="Sultan Tammam Musyaffa">
        <h2>Sultan Tammam Musyaffa</h2>
        <div class="social-icons">
            <a href="mailto:sultantammam3@gmail.com" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="https://instagram.com/sltnmsyffa_" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://t.me/sltnmsyffa26" target="_blank" aria-label="Telegram">
                <i class="fab fa-telegram-plane"></i>
            </a>
            <a href="https://github.com/Tanmsyffa" target="_blank" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </div>
    
    <script>
        function toggleMode() {
            document.body.classList.toggle("light-mode");
            
            // Save preference to localStorage
            const isLightMode = document.body.classList.contains("light-mode");
            localStorage.setItem("lightMode", isLightMode);
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem("lightMode");
            if (savedMode === "true") {
                document.body.classList.add("light-mode");
            }
        });
    </script>
</body>
</html>
